  caption: '{{giant}} {{giant.outfit}} She is a GIANT woman, many times taller than the buildings around her, the top of the frame cutting off above her waist, one huge foot crushing the corner of a building in a cloud of dust and rubble, leaning forward and reaching one huge hand down toward the street below, laughing with delight.'
  bbox:
  - -560
  - -760
  - 512
  - -60
- label: object
  caption: '{{runner}} {{runner.outfit}} She is a normal-sized woman at the bottom right of the frame, much smaller than the giant, SPRINTING toward the RIGHT edge of the frame at full speed, AWAY from the giant behind her on the left: her body leans far forward into the sprint, her arms pumping desperately, her legs in a full sprint stride, her hair, skirt and the white cloth strips of her cape streaming behind her to the left, motion blur on her limbs. Her face is twisted in TERROR as she glances back over her shoulder at the giant: eyes wide with tiny pupils, mouth open in a scream, tears and sweat flying off her face.'
