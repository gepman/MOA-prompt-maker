id: kuroemon_dress
name: クロエモン・修道女ドレス
moss: 'She wears a nun-like outfit: a long orange dress, a short white cape that ends at her shoulders, and a white cap with orange trim on her head. From the back of the short cape hang several long thin strips of white cloth like squid tentacles, reaching far down her back.'
anima: orange dress, nun, white cape, short cape, long white cloth strips, tentacle-like cloth strips, white cap, orange trim, nun cap
